name: tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install label-generation dependencies
        run: python -m pip install --upgrade pip qrcode reportlab

      - name: Provision local test data for the end-to-end smoke test
        # A fresh checkout has no git-ignored config.json / slugs.txt, so create a
        # self-consistent, non-personal fixture (example.com contacts match the
        # committed smoke-test.config.example; a few throwaway slugs to serve).
        run: |
          ./init-local-files.sh
          python -c "import json; c=json.load(open('found-cgi/config.example.json')); c.update(owner_name='Example Owner', email='owner@example.com', backup_email='backup@example.com'); json.dump(c, open('found-cgi/config.json','w'))"
          ./mint-slugs.sh -n 5

      - name: Run test suite
        run: ./test/run.sh
